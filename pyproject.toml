[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "common-models"
version = "0.2.0"
description = "Shared Flask-SQLAlchemy models and helpers for kvant-as apps"
requires-python = ">=3.10"
dependencies = [
    "Flask-SQLAlchemy>=3.0.0",
    "Flask-Login>=0.6.0",
    "Flask-Migrate>=4.0.0",
    "PyJWT>=2.0.0",
    "user-agents>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
common_models = [
    "templates/**/*.html",
    "migrations/*",
    "migrations/**/*",
    "admin/templates/**/*.html",
    "admin/static/**/*",
    "session_ui_assets/**/*",
    "forms_ui_assets/**/*",
]
